<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="スキルマップ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>看護スキル総合力マップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* VOICE everyday: 看護師本人も管理者も前向きになれる、明るく温かいスキル帳
   IDEA スキル帳の「マイページ」：澄んだ青の地に白いカード、大きな総合力、色付きスキル札とレベルの点
   PICTURE 6軸レーダー（個人・比較・組織平均）、スキル札リスト、部署×看護師の適合度マップ
   COLOUR 空色→藍のグラデーション帯、白カード、数字は濃い青 #1b5fd0、スキル札は寒色パステル
   TYPE M PLUS Rounded 1c 800 + Noto Sans JP
   LAYOUT 上部に濃紺帯とタブ、画面ごとに「図」を左、数値と操作を右。600px以下は縦積み */
:root{color-scheme:light dark;--bg:light-dark(#eef5fc,#0d1422);--card:light-dark(#ffffff,#172236);--ink:light-dark(#13223a,#e9f0fa);--sub:light-dark(#566a85,#a3b6cf);--line:light-dark(#d9e5f2,#2a3a55);--panel:light-dark(#ffffff,#172236);--soft:light-dark(#f2f7fd,#1f2c44);--hot:light-dark(#1b5fd0,#74b0ff);--band:linear-gradient(165deg,#38b6e8 0%,#2f7fe0 55%,#4a55d6 100%);--bandink:#ffffff;--s1:light-dark(#257de0,#338ced);--s2:light-dark(#f47230,#e76624);--s3:light-dark(#00b894,#00a888);--bad:light-dark(#d9432f,#ff7a66);--good:light-dark(#0a7d32,#3ecf6e)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans JP",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"M PLUS Rounded 1c","Noto Sans JP",sans-serif;font-weight:800;line-height:1.2;letter-spacing:-.01em;margin:0}
h1{font-size:clamp(24px,3.4vw,34px)}
h2{font-size:clamp(22px,3vw,30px);text-wrap:balance}
h3{font-size:18px}
.band{padding:clamp(20px,3vw,40px) max(4vw,16px)}
.top{background:var(--band);color:var(--bandink);padding:18px max(4vw,16px) 0;text-shadow:0 1px 2px rgba(10,40,110,.3)}
.top .row{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;max-width:1240px;margin:auto}
.top p{margin:0;opacity:.85;font-size:14px}
nav{display:flex;gap:4px;overflow-x:auto;max-width:1240px;margin:14px auto 0}
nav a{flex:none;color:#fff;text-decoration:none;padding:11px 16px;border-radius:10px 10px 0 0;font-weight:500;opacity:.85}
nav a:hover{opacity:1;background:rgba(255,255,255,.1)}
nav a.on{background:var(--bg);color:var(--hot);opacity:1;text-shadow:none;font-weight:700}
main{max-width:1240px;margin:auto}
.muted{color:var(--sub);font-size:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 6px 20px -12px rgba(30,80,170,.35)}
.grid2{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:24px;align-items:start}
.fig{position:relative;min-height:380px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
svg text{paint-order:stroke;stroke:var(--card);stroke-width:4px;font-family:"Noto Sans JP",sans-serif}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(7.5em,1fr));gap:12px;margin:16px 0}
.kpi{background:var(--card);border-radius:18px;padding:12px 14px;border:1px solid var(--line)}
.kpi b{display:block;font:800 clamp(26px,3.4vw,34px)/1.1 "M PLUS Rounded 1c",sans-serif;white-space:nowrap;color:var(--hot)}
.kpi span{font-size:13px;color:var(--sub)}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:8.5em minmax(0,1fr) 3em;gap:10px;align-items:center;font-size:14px}
.bar .t{height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--s1);border-radius:0 4px 4px 0}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:800;color:var(--hot)}
.bar.low .t i{background:var(--bad)}
button,.btn{font:500 15px "Noto Sans JP",sans-serif;min-height:44px;padding:8px 18px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--s1)}
button.pri,a.pri{background:linear-gradient(90deg,#2b9ce8,#3d5fdc);border-color:transparent;color:#fff;font-weight:700;border-radius:99px}
button.warn{color:var(--bad);border-color:var(--bad)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,label.opt:focus-within{outline:3px solid var(--s2);outline-offset:2px}
input,select,textarea{font:16px "Noto Sans JP",sans-serif;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-height:44px}
textarea{width:100%;min-height:140px;font-size:13px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-weight:500;color:var(--sub);font-size:13px;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover{background:var(--soft)}
.spark{display:flex;gap:3px;align-items:flex-end;height:26px}
.spark i{width:9px;background:var(--s1);border-radius:2px 2px 0 0}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.tag.bad{color:var(--bad);border-color:var(--bad)}
/* assessment */
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 18px}
.steps button{min-height:38px;padding:4px 12px;font-size:14px}
.steps button.on{background:var(--hot);color:#fff;border-color:var(--hot)}
.steps button{border-radius:99px}
.steps button.done::after{content:" ✓";color:var(--good)}
.q{padding:16px 0;border-bottom:1px solid var(--line)}
.q p{margin:0 0 10px;font-weight:500}
.opts{display:flex;flex-wrap:wrap;gap:6px}
label.opt{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:44px;font-size:14px;cursor:pointer;background:var(--bg)}
label.opt input{position:absolute;opacity:0;width:1px;height:1px}
label.opt b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--soft);font-size:12px}
label.opt:has(input:checked){border-color:var(--hot);background:color-mix(in srgb,var(--hot) 12%,var(--card))}
label.opt:has(input:checked) b{background:var(--hot);color:#fff}
.field{display:grid;gap:4px;font-size:14px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(14em,1fr));gap:14px}
.sticky{position:sticky;top:12px}
.live>b{font:800 52px/1 "M PLUS Rounded 1c",sans-serif;color:var(--hot)}
/* heatmap */
.hm td.c{text-align:center;font-variant-numeric:tabular-nums;font-size:13px;min-width:4.2em;border:2px solid var(--card);position:relative}
.hm td.c.cur{outline:2px dashed var(--ink);outline-offset:-4px}
.hm td.c.pick{font-weight:700}
.hm td.c.pick::after{content:"●";position:absolute;top:1px;right:4px;font-size:9px;color:var(--s2)}
.hm th.d{writing-mode:horizontal-tb;font-size:12px;min-width:4.2em;text-align:center}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--sub);align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.note{font-size:13px;color:var(--sub);margin-top:10px}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;padding:6px 10px;border-radius:8px;opacity:0;transition:opacity .1s;z-index:9;max-width:260px}
.dlg{border:1px solid var(--bad);border-radius:10px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.deptcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:10px}
.wts{display:grid;grid-template-columns:repeat(auto-fit,minmax(4.6em,1fr));gap:6px}
.wts select{padding:6px 4px}
.wts label{font-size:12px;display:grid;gap:2px}
.chk{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.chk label{display:flex;gap:4px;align-items:center}
.chk input{min-height:0;width:18px;height:18px}
.hero{background:var(--band);margin:calc(-1*clamp(20px,3vw,40px)) calc(-1*max(4vw,16px)) 24px;padding:18px max(4vw,16px) 26px;color:#fff;text-align:center}
.hero .name{display:inline-block;background:rgba(255,255,255,.88);color:var(--ink);font:800 22px "M PLUS Rounded 1c",sans-serif;padding:6px 26px;border-radius:16px}
.hero .big{font:800 clamp(72px,14vw,120px)/1 "M PLUS Rounded 1c",sans-serif;color:#fff;text-shadow:0 4px 18px rgba(10,40,120,.4);margin:6px 0 0}
.hero .big small{font-size:22px;opacity:.85}
.hero .chips{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:14px}
.hero .chip{background:var(--card);color:var(--ink);border-radius:20px;padding:8px 18px;min-width:8.5em}
.hero .chip span{display:block;font-size:13px;color:var(--sub)}.hero .chip b{font:800 22px "M PLUS Rounded 1c",sans-serif}
.sgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 8px;text-align:center}
.sgrid span{display:block;font-size:13px;font-weight:700;line-height:1.3;min-height:2.6em}
.sgrid b{font:800 clamp(30px,5vw,44px)/1 "M PLUS Rounded 1c",sans-serif;color:var(--hot)}
.sgrid .low b{color:var(--bad)}
.skl{display:grid;gap:6px}
.skl .hd{display:flex;justify-content:space-between;align-items:center;background:var(--soft);border-left:4px solid var(--s1);border-radius:12px;padding:10px 14px;margin-bottom:6px}
.skl .hd b{font-family:"M PLUS Rounded 1c",sans-serif}
.cnt{background:var(--s1);color:#fff;border-radius:99px;padding:1px 12px;font-weight:700;font-size:14px}
.sk{display:grid;grid-template-columns:minmax(0,1.4fr) auto;gap:12px;align-items:center;padding:6px 8px;border-radius:14px}
.sk:nth-child(even){background:var(--soft)}
.pill{border-radius:10px;padding:8px 10px;text-align:center;font-weight:700;color:#2b1d15;font-size:15px;line-height:1.3}
.dots{display:flex;gap:7px;align-items:center}
.dots i{width:18px;height:18px;border-radius:50%;background:light-dark(#dcdcdc,#4a3d36)}
.dots i.on{width:30px;height:30px;display:grid;place-items:center;font:800 15px "M PLUS Rounded 1c",sans-serif;font-style:normal;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.25)}
.redo{display:block;width:100%;margin-top:12px;border:0;border-radius:99px;background:linear-gradient(90deg,#3fc1d0,#5b7ff0);color:#fff;font-weight:700}
.cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;align-items:start}
.ga{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.home{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(18px,3vw,40px);align-items:center;background:var(--band);color:#fff;margin:calc(-1*clamp(20px,3vw,40px)) calc(-1*max(4vw,16px)) 0;padding:clamp(24px,4vw,48px) max(4vw,16px)}
.home h2{font-size:clamp(30px,4.4vw,48px);line-height:1.1;text-shadow:0 2px 10px rgba(10,40,120,.3)}
.home p{font-size:17px;margin:14px 0 22px;max-width:30em}
.home .go{display:inline-flex;align-items:center;min-height:52px;padding:10px 28px;border-radius:99px;background:#fff;color:#1b5fd0;font-weight:800;text-decoration:none;font-size:17px;box-shadow:0 8px 20px -8px rgba(10,40,120,.5)}
.home .sub{display:inline-flex;align-items:center;min-height:52px;padding:10px 20px;color:#fff;font-weight:700;margin-left:6px}
.art{background:var(--card);border-radius:28px;box-shadow:0 18px 40px -18px rgba(10,40,120,.55);aspect-ratio:16/10}
.art svg{width:100%;height:100%;display:block}
.flow{offset-path:path("M218 170 C 270 120, 320 230, 372 176");offset-rotate:0deg}
@media(prefers-reduced-motion:no-preference){.flow{animation:flow 2.4s linear infinite}.flow.f2{animation-delay:.8s}.flow.f3{animation-delay:1.6s}@keyframes flow{from{offset-distance:0%;opacity:0}15%{opacity:1}85%{opacity:1}to{offset-distance:100%;opacity:0}}.rgrow{transform-origin:478px 182px;animation:rg 3.2s ease-in-out infinite alternate}@keyframes rg{from{transform:scale(.82)}to{transform:scale(1)}}}
@media(prefers-reduced-motion:reduce){.flow{offset-distance:50%}}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:28px}
.how .panel{display:grid;gap:6px}.how b.no{font:800 30px/1 "M PLUS Rounded 1c",sans-serif;color:var(--hot)}
.axchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.axchips span{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-weight:700;font-size:14px}
@media(max-width:760px){.home{grid-template-columns:minmax(0,1fr)}.how{grid-template-columns:minmax(0,1fr)}}
@media(max-width:860px){.grid2,.ga{grid-template-columns:minmax(0,1fr)}.sticky{position:static}.ga .sticky{order:-1}}
@media(max-width:600px){.fig{min-height:320px}.bar{grid-template-columns:6.5em minmax(0,1fr) 2.6em}table{font-size:13px}th,td{padding:6px 4px}.hide-s{display:none}}
@media(prefers-reduced-motion:no-preference){.grow{animation:grow .6s ease-out}@keyframes grow{from{transform:scale(.6);opacity:0}}}
</style>
</head>
<body>
<header class="top">
  <div class="row"><h1>看護スキル総合力マップ</h1><p>質問に答えるだけで、6つの領域のスキルを見える形に</p></div>
  <nav id="nav">
    <a href="#home" data-r="home">ホーム</a>
    <a href="#list" data-r="list">組織・一覧</a>
    <a href="#assess" data-r="assess">スキル評価</a>
    <a href="#analysis" data-r="analysis">部署のスキル分析</a>
    <a href="#settings" data-r="settings">設定・データ</a>
  </nav>
</header>
<main id="app" class="band"></main>
<div class="tip" id="tip"></div>
<script>
{
const AX=[{k:'basic',n:'基礎スキル',s:'基礎'},{k:'hosp',n:'病院独自スキル',s:'病院独自'},{k:'spec',n:'専門スキル',s:'専門'},{k:'exp',n:'経験年数',s:'経験'},{k:'nontech',n:'ノンテクニカル',s:'ノンテク'},{k:'night',n:'夜勤対応力',s:'夜勤'}];
const SC_SKILL=['未経験・できない','指導を受けながらできる','一人でできる','状況に応じ応用できる','他者に指導できる'];
const SC_FREQ=['ほとんどできない','ときどきできる','おおむねできる','いつもできる','模範を示せる'];
const SC_HOSP=['未受講・未経験','受講中・一部習得','修了・習得済み','実践で活用している','指導者・推進役'];
const SC_NIGHT=['夜勤未経験','見習い中','独り立ち','夜勤リーダー経験あり','夜勤リーダーを常時担う'];
const BASIC=[['b1','バイタルサイン測定とフィジカルアセスメントで、異常の兆候に気づける'],['b2','注射・点滴・輸液ポンプ等の与薬を、確認手順を守り安全に実施できる'],['b3','採血・末梢静脈路確保ができる'],['b4','標準予防策・感染経路別予防策を実践できる'],['b5','転倒転落・褥瘡などのリスクを評価し、予防策を立てられる'],['b6','看護記録を正確かつ適時に記載できる'],['b7','急変時にBLS（一次救命処置）を実施し、応援を呼べる'],['b8','患者・家族への説明や退院に向けた指導ができる']];
const SPEC=[['s_er','救急看護（トリアージ・初期対応）'],['s_icu','集中治療（人工呼吸器・鎮静・循環補助などの管理）'],['s_cv','循環器看護（心電図判読・心カテ前後の管理）'],['s_neuro','脳神経看護（意識レベル評価・脳卒中急性期ケア）'],['s_ope','手術看護（器械出し・外回り）'],['s_onc','がん・緩和ケア（化学療法・疼痛管理）'],['s_rehab','リハビリテーション・回復期看護（ADL評価・在宅復帰支援）'],['s_dial','透析看護'],['s_psy','精神科看護（精神状態のアセスメント・行動制限下のケア）'],['s_ortho','整形外科看護（術前後管理・ロコモ・転倒予防）'],['s_home','在宅・訪問看護（在宅療養支援・地域連携）'],['s_gi','消化器看護（内視鏡検査・治療の前後管理・消化器疾患）'],['s_surg','外科病棟看護（周術期管理・ドレーン・創傷管理）'],['s_med','内科看護（慢性疾患・多疾患併存の管理と療養指導）']];
const NONTECH=[['n1','患者・家族・多職種と、相手に合わせたコミュニケーションがとれる'],['n2','チームの状況を見て、自ら協力・応援を申し出られる'],['n3','SBARなどで要点を簡潔に報告・相談できる'],['n4','病棟全体の状況を把握し、変化を予測して動ける（状況認識）'],['n5','限られた情報から優先順位を判断し、意思決定できる'],['n6','リーダーとして業務調整・指示出しができる'],['n7','後輩・学生の指導や相談対応ができる'],['n8','ストレスや疲労をセルフコントロールし、周囲にも配慮できる']];
const NIGHT=[['nt2','少人数体制で急変が起きたとき、初期対応と応援要請を判断できる'],['nt3','夜間に複数患者のケア・処置の優先順位を組み立てられる'],['nt4','夜間の医師への報告・指示受けの必要性を適切に判断できる'],['nt5','不穏・せん妄のある患者に安全に対応できる']];
const SHORT={s_rehab:'回復期リハ看護',b1:'身体所見評価',b2:'与薬・注射',b3:'採血・静脈路確保',b4:'感染対策',b5:'リスク予防',b6:'看護記録',b7:'急変時BLS',b8:'患者・家族指導',n1:'コミュニケーション',n2:'チームワーク',n3:'報連相（SBAR）',n4:'状況認識',n5:'意思決定',n6:'リーダーシップ',n7:'育成対応力',n8:'セルフコントロール',nt1:'夜勤での役割',nt2:'夜間急変対応',nt3:'優先順位づけ',nt4:'医師報告の判断',nt5:'不穏・せん妄対応'};
const PILL=['#a9d8fb','#9fe6dc','#c3c9fa','#b8e6c4','#9cc4f5','#d3c4f2','#a6e3ee','#b9d0f7','#a8ead0','#c9d7ff','#9fd9f0','#d8cff6','#b3e0e8','#bfd6ea'];

function qids(){return[...BASIC,...S.hosp,...SPEC,...NONTECH,['nt1'],...NIGHT].map(q=>q[0])}
function toCSV(){const ids=qids();const head=['id','氏名','所属部署','部署グループ','経験年数','経験部署数','現部署年数','資格','夜勤可能回数','更新日',...ids,...AX.map(a=>a.n),'総合力'];
 const c=v=>{v=String(v??'');return/[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
 return[head,...S.nurses.map(n=>{const s=score(n);return[n.id,n.name,n.dept,grpOf(n.dept),n.years,n.deptCount,n.curYears,QUAL[n.qual||0][0],NAVAIL[+n.navail||0],n.updated,...ids.map(i=>n.a[i]??''),...s.arr.map(r0),r0(s.total)]})].map(r=>r.map(c).join(',')).join('\n')}
function parseCSV(t){const rows=[];let r=[],f='',q=false;t=t.replace(/^﻿/,'');for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}else if(ch==='"')q=true;else if(ch===','){r.push(f);f=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(f);rows.push(r);r=[];f=''}else f+=ch}if(f||r.length){r.push(f);rows.push(r)}return rows.filter(x=>x.some(v=>v!==''))}
function fromCSV(t){const rows=parseCSV(t);if(rows.length<2)throw new Error('データ行がありません');const h=rows[0];const ix=k=>h.indexOf(k);if(ix('氏名')<0)throw new Error('「氏名」列が見つかりません');const ids=qids();let cnt=0;
 rows.slice(1).forEach(r=>{const g=k=>ix(k)>=0?r[ix(k)]:'';const a={};ids.forEach(id=>{const v=g(id);if(v!==''&&!isNaN(+v))a[id]=Math.max(0,Math.min(4,+v))});
  const rec={id:g('id')||uid(),name:g('氏名'),dept:g('所属部署'),years:+g('経験年数')||0,deptCount:+g('経験部署数')||1,curYears:+g('現部署年数')||0,qual:Math.max(0,QUAL.findIndex(q=>q[0]===g('資格'))),navail:Math.max(0,NAVAIL.indexOf(g('夜勤可能回数'))),updated:g('更新日')||new Date().toISOString().slice(0,10),a};
  if(!rec.name)return;const k=S.nurses.findIndex(x=>x.id===rec.id);if(k>=0)S.nurses[k]=rec;else S.nurses.push(rec);cnt++});save();return cnt}
